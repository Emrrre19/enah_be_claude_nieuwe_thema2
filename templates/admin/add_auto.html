{% extends "base.html" %}
{% block title %}Wagen toevoegen – ENAH{% endblock %}
{% block content %}

<section class="container" style="max-width: 560px;">
  <h1>Wagen toevoegen</h1>
  <form class="styled-form" id="auto-form" method="POST" enctype="multipart/form-data">
    <div>
      <label for="merk">Merk *</label>
      <input type="text" id="merk" name="merk" required>
    </div>
    <div>
      <label for="model">Model *</label>
      <input type="text" id="model" name="model" required>
    </div>
    <div>
      <label for="jaar">Bouwjaar *</label>
      <input type="number" id="jaar" name="jaar" min="1950" max="2100" required>
    </div>
    <div>
      <label for="prijs">Prijs (&euro;) *</label>
      <input type="number" id="prijs" name="prijs" min="0" step="0.01" required>
    </div>
    <div>
      <label for="beschrijving">Beschrijving</label>
      <textarea id="beschrijving" name="beschrijving"></textarea>
    </div>
    <div>
      <label for="fotos">Foto's (meerdere mogelijk)</label>
      <input type="file" id="fotos" name="fotos" accept="image/*" multiple onchange="checkUploadSize(this)">
      <small style="color: var(--text-muted);">Selecteer één of meerdere foto's</small>
      <small id="fotos-warning" style="display:none; color: var(--error); font-weight: 600;"></small>
    </div>
    <div>
      <label for="extra_info">Extra informatie</label>
      <textarea id="extra_info" name="extra_info" placeholder="Optionele extra informatie over de auto..."></textarea>
    </div>
    <button class="btn" type="submit">Wagen opslaan</button>
    <a class="btn btn-secondary" href="{{ url_for('admin_dashboard') }}">Annuleren</a>
  </form>
</section>

<script>
const MAX_UPLOAD_BYTES = 90 * 1024 * 1024; // 90MB veiligheidsmarge onder de 100MB-limiet van de hosting

function checkUploadSize(input) {
  let total = 0;
  for (const file of input.files) total += file.size;
  const warningEl = document.getElementById(input.id + '-warning');
  if (total > MAX_UPLOAD_BYTES) {
    warningEl.textContent = `Let op: deze foto's zijn samen ${(total / (1024 * 1024)).toFixed(1)}MB — dat is te groot om in één keer te uploaden (max. ongeveer 90MB). Selecteer minder foto's, of voeg de rest later toe via 'Bewerken'.`;
    warningEl.style.display = 'block';
  } else {
    warningEl.style.display = 'none';
  }
}

document.getElementById('auto-form').addEventListener('submit', function(e) {
  const fotosInput = document.getElementById('fotos');
  if (fotosInput && fotosInput.files.length) {
    let total = 0;
    for (const file of fotosInput.files) total += file.size;
    if (total > MAX_UPLOAD_BYTES) {
      e.preventDefault();
      alert(`De geselecteerde foto's zijn samen ${(total / (1024 * 1024)).toFixed(1)}MB. Dat is te groot om in één keer te uploaden. Selecteer minder foto's, of sla de wagen eerst op en voeg de rest van de foto's daarna toe via 'Bewerken'.`);
    }
  }
});
</script>

{% endblock %}
